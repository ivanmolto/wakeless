packages:
  - packages/*
  - packages/watcher/web
  - scripts

allowBuilds:
  # bufferutil and utf-8-validate: optional native speedups for rpc-websockets
  # (via @magicblock-labs/ephemeral-rollups-kit); the pure-JS fallback is used.
  bufferutil: false
  esbuild: false
  utf-8-validate: false

saveExact: true
